<style>
/* Styles.html — Giao diện LSB CRM. Màu lấy theo tiêu đề cột trong Google Sheet:
   navy #1F2F3D (nhập tay) · cam #A7650F (khóa chính) · xanh #1D5C96 (khóa ngoại) · xám #7A8894 (auto) */
:root{
  --navy:#1F2F3D; --navy-2:#2B3F52; --orange:#A7650F; --orange-soft:#FBF1E4; --blue:#1D5C96; --blue-soft:#E8F0F8;
  --grey:#7A8894; --bg:#F4F6F8; --card:#FFFFFF; --line:#E1E6EB; --text:#1B2631; --muted:#5F6B76;
  --ok:#1A7F37; --ok-soft:#E6F4EA; --warn:#9A6700; --warn-soft:#FFF4D6; --danger:#C62828; --danger-soft:#FDECEC;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --font:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 var(--font)}
a{color:var(--blue);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font:inherit}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{width:232px;flex:0 0 232px;background:var(--navy);color:#DDE5EC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;color:#fff;font-size:16px;letter-spacing:.3px}
.brand span{font-size:12px;color:#9FB0BF}
.nav-group{padding:12px 10px 4px}
.nav-group h6{margin:0 8px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#8093A4;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#DDE5EC;cursor:pointer;user-select:none}
.nav-item:hover{background:var(--navy-2);text-decoration:none}
.nav-item.active{background:var(--orange);color:#fff}
.nav-item .ico{width:18px;text-align:center;opacity:.9}
.nav-item.disabled{opacity:.55}
.sidebar-foot{margin-top:auto;padding:12px 18px;font-size:12px;color:#8093A4;border-top:1px solid rgba(255,255,255,.08)}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none;border:0;background:none;font-size:20px;cursor:pointer;padding:4px 8px}
.bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.bell .dot{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;line-height:18px}
.user-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600}
.view{padding:20px;max-width:1400px;width:100%;margin:0 auto}

/* ---------- Building blocks ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{margin:0;flex:1}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>.col{flex:1 1 320px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.hidden{display:none!important}
.page-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head .title{flex:1;min-width:240px}
.page-head h2{margin:0 0 4px;font-size:20px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:4px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F0F3F6}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#174C7C}
.btn.accent{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.danger{color:var(--danger);border-color:#F1C4C4}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
input,select,textarea{font:inherit;color:var(--text);border:1px solid #CBD3DB;border-radius:8px;padding:7px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(29,92,150,.25);border-color:var(--blue)}
.toolbar input,.toolbar select{width:auto;min-width:150px}
.toolbar label,.card-head label{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.toolbar input[type=checkbox],.card-head input[type=checkbox]{flex:none;min-width:0;width:auto;margin:0;padding:0}
textarea{min-height:72px;resize:vertical}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.danger .v{color:var(--danger)} .kpi.accent{border-top:3px solid var(--orange)}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{background:#F7F9FA;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:8px 10px;border-bottom:1px solid #EEF1F4;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#F5F9FD}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .id{font-family:Consolas,Menlo,monospace;font-size:12px;color:var(--orange);white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--muted)}

.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#EEF1F4;color:#44515D;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)} .badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.orange{background:var(--orange-soft);color:var(--orange)}

/* Progress */
.prog{margin:6px 0 12px}
.prog .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.bar{height:8px;background:#E9EDF1;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:6px}
.bar.ok>i{background:var(--ok)} .bar.orange>i{background:var(--orange)}

/* Info grid */
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 18px}
.info div .k{font-size:12px;color:var(--muted)}
.info div .v{word-break:break-word}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tab .n{background:#EEF1F4;border-radius:10px;padding:0 7px;font-size:11px;margin-left:4px}

/* Alerts */
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:8px;border:1px solid var(--line);background:#fff}
.alert.danger{border-left:4px solid var(--danger)} .alert.warn{border-left:4px solid #D4A21A} .alert.info{border-left:4px solid var(--blue)}
.alert .t{font-weight:600} .alert .d{font-size:12px;color:var(--muted)}
.note{padding:10px 12px;border-radius:8px;background:var(--blue-soft);color:#16456F;margin-bottom:12px}
.note.warn{background:var(--warn-soft);color:#6B4A00}
/* Chuỗi bước báo giá (Báo giá 360°) */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:14px}
.flow-step{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.flow-step b{display:block;font-size:13px;color:var(--muted)}
.flow-step span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.flow-step.done{border-top-color:var(--ok)}
.flow-step.done b{color:var(--ok)}

/* Modal & form */
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:40px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:760px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;flex:1;font-size:16px}
.modal-h .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.modal-b{padding:16px 18px;max-height:calc(100vh - 220px);overflow-y:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field.full{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:600;color:#3A4754;margin-bottom:4px}
.field label .req{color:var(--danger)}
.field .hint{font-size:11px;color:var(--muted);margin-top:3px}
.field .err{font-size:12px;color:var(--danger);margin-top:3px}
.field.has-err input,.field.has-err select,.field.has-err textarea{border-color:var(--danger)}
.field label .code{font-size:11px;color:var(--muted);font-weight:400;font-family:Consolas,Menlo,monospace}
.lang-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-weight:700;font-size:12px;cursor:pointer;color:var(--navy)}
.lang-btn:hover{border-color:var(--orange);color:var(--orange)}
.field label .need{color:var(--orange);font-weight:700}
.draft-bar{padding:8px 12px;border-radius:8px;background:var(--blue-soft);color:#16456F;margin-bottom:12px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.draft-bar.warn{background:var(--warn-soft);color:#6B4A00}
.draft-bar .small{flex-basis:100%}
.field .ro{padding:7px 10px;background:#F4F6F8;border-radius:8px;color:var(--orange);font-family:Consolas,Menlo,monospace}
.pct-wrap{position:relative}.pct-wrap input{padding-right:28px}.pct-wrap span{position:absolute;right:10px;top:8px;color:var(--muted)}

/* Toast & loading */
#toast-root{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:420px}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;animation:tin .2s ease}
.toast.ok{background:var(--ok)} .toast.warn{background:#8A5D00} .toast.danger{background:var(--danger)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.loading{padding:40px;text-align:center;color:var(--muted)}
.spinner{width:26px;height:26px;border:3px solid #D5DDE5;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.topbar .busy{width:16px;height:16px;border:2px solid #D5DDE5;border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}

.qtable td.num{min-width:90px}
.status-bars .sb{display:grid;grid-template-columns:150px 1fr 36px;gap:8px;align-items:center;margin-bottom:6px;font-size:13px}
.diff{font-size:12px;color:var(--muted)} .diff b{color:var(--text);font-weight:600}
.fatal{max-width:560px;margin:80px auto;text-align:center}

/* ---------- Dashboard 4 tab (v2.6) ---------- */
.dash-filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}
.dash-filters label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.dash-filters select{width:auto;max-width:190px;padding:5px 8px;text-transform:none;letter-spacing:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--text)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--blue);color:#fff}
.dash-tabs .tab{font-size:14px}
.dash-how{margin-top:10px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.dash-how summary{cursor:pointer;font-weight:600}
.dash-how ul{margin:6px 0 0;padding-left:18px}
.dash-how code{font-family:Consolas,Menlo,monospace;font-size:11.5px;background:#F0F3F6;padding:0 3px;border-radius:3px}
.dash-pbar{display:flex;align-items:center;gap:6px;min-width:110px}
.dash-pbar .bar{flex:1;height:6px}
.dash-pbar span{font-size:12px;font-variant-numeric:tabular-nums}
.dash-legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.dash-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.dash-legend i.plan,.dash-hbar i.plan{background:#A9C1D8} .dash-legend i.paid,.dash-hbar i.paid{background:var(--blue)}
.dash-chart{border:0}
.dash-chart svg{display:block;width:100%;min-width:560px;height:auto}
.dash-chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.dash-chart text.cur{fill:var(--text);font-weight:700}
.dash-chart line.grid{stroke:var(--line);stroke-width:1}
.dash-chart rect.plan{fill:#A9C1D8} .dash-chart rect.paid{fill:var(--blue)}
.dash-tree tr.lv1 td{background:#F3F6F9}
.dash-tree tr.lv2 td:first-child{padding-left:28px}
.dash-tree tr.lv3 td:first-child{padding-left:48px}
.dash-tree .tw{display:inline-block;width:14px;color:var(--muted)}
.dash-warn{color:var(--warn)} .dash-bad{color:var(--danger);font-weight:600}
.dash-chk{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dash-chk li{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.dash-hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px 10px;align-items:center;font-size:13px}
.dash-hbar .track{height:14px;background:#E9EDF1;border-radius:3px;display:flex;overflow:hidden}
.dash-hbar .num{font-variant-numeric:tabular-nums}
.dash-q summary{cursor:pointer}

/* ---------- Mobile ---------- */
@media (max-width:900px){
  .sidebar{position:fixed;left:-260px;z-index:60;transition:left .2s;height:100vh}
  .app.nav-open .sidebar{left:0;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .menu-btn{display:block}
  .view{padding:14px}
  .user-chip .nm{display:none}
  .form-grid{grid-template-columns:1fr}
  .toolbar input,.toolbar select{flex:1 1 140px;min-width:0}
  .modal-bg{padding:0}
  .modal{border-radius:0;min-height:100vh}
  .modal-b{max-height:none}
  .status-bars .sb{grid-template-columns:110px 1fr 30px}
}
</style>
