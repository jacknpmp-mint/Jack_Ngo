<style>
/* Custom.html — phần riêng LSB v3.0 (Dashboard 5 tab, Dự án 360°). CSS chung dashboard đã có ở Styles.html. */
.dash-funnel{display:grid;gap:6px}
.dash-funnel .row1{display:grid;grid-template-columns:minmax(96px,130px) 1fr 44px;gap:10px;align-items:center;font-size:13px}
.dash-funnel .track{height:16px;background:#E9EDF1;border-radius:3px;overflow:hidden}
.dash-funnel .track i{display:block;height:100%;background:var(--blue);border-radius:3px}
.dash-funnel .track i.ok{background:var(--ok)} .dash-funnel .track i.mute{background:var(--grey)}
.dash-hbar i.won{background:var(--ok)} .dash-hbar i.lost{background:var(--danger)} .dash-hbar i.mute{background:var(--grey)}
.dash-legend i.won{background:var(--ok)} .dash-legend i.lost{background:var(--danger)}
.nowrap{white-space:nowrap}
</style>
<script>
/**
 * Custom.html — Phần giao diện RIÊNG của LSB CRM · Bidding · Project (DB v4.6). Nạp sau cùng.
 *  1. UI.AUTOFILL / UI.FK_GROUP_FILTER: tự điền cột phụ thuộc khi chọn FK; lọc đầu việc chuẩn theo giai đoạn.
 *  2. Dashboard 5 tab (bản mẫu v3.0 đã duyệt): Tổng quan · Thầu & pipeline · Công nợ & thu tiền · Sản xuất & giao hàng ·
 *     Khách hàng & thị trường + Kiểm tra dữ liệu. Dữ liệu: dashboard.get › Lsb_board_ (20_Lsb.gs); lọc/đổi tiền/cửa sổ ngày
 *     vẽ lại ở trình duyệt, không gọi lại server.
 *  3. Dự án 360° (custom360.LSB_project): KPI tài chính, tab Thông tin / Đầu việc / Lô hàng / Thanh toán / Chi phí / Bài học / Nhật ký.
 */

/* ============================== 1. Form ============================== */
UI.AUTOFILL.LSB_Customer = [{ fk: 'Lead_id', ref: 'LSB_Lead', fill: function (p) {
  return { Nation: p.Nation, Contact: p.Contact_name, Account_owner_id: p.Owner_id }; } }];
(function () {
  function dueRule(start, due) {
    return { fk: 'Task_id', ref: 'LSB_Task', also: [start], fill: function (p, v) {
      var n = Number(p.Std_duration_days), o = {};
      if (v[start] && n > 0) o[due] = Fmt.addDays(v[start], n);
      return o; } };
  }
  UI.AUTOFILL.LSB_Lead_Qualifying = [dueRule('Qual_Start_day', 'Qual_Due_day')];
  UI.AUTOFILL.LSB_Bidding_action_plan = [dueRule('Start_day', 'Due_day'),
    { fk: 'Quotation_code', ref: 'LSB_Quotation', fill: function (p) { return { Lead_id: p.Lead_id }; } }];
  UI.AUTOFILL.LSB_Project_task = [dueRule('Start_day', 'Due_day')];
})();
UI.AUTOFILL.LSB_Result_Lesson = [{ fk: 'Quotation_code', ref: 'LSB_Quotation', fill: function (p) { return { Project_id: p.Project_calc }; } }];
UI.AUTOFILL.LSB_shipment = [{ fk: 'Project_id', ref: 'LSB_project', fill: function (p) { return { Shipment_no: p.Next_Shipment_no }; } }];
UI.AUTOFILL.LSB_Project_handover_lesson = [{ fk: 'Project_id', ref: 'LSB_project', fill: function (p) {
  return { Handover_day: p.Project_handover || App.boot.today }; } }];
UI.AUTOFILL.LSB_payment_plan = [{ fk: 'Project_id', ref: 'LSB_project', also: ['Payment_pct'], fill: function (p, v) {
  var c = Number(p.Contract_USD);
  return c && v.Payment_pct !== '' && v.Payment_pct !== undefined && v.Payment_pct !== null ? { Payment_USD: Math.round(c * v.Payment_pct * 100) / 100 } : {}; } }];
UI.AUTOFILL.LSB_paid = [{ fk: 'PaymentPlan_id', ref: 'LSB_payment_plan', fill: function (p) {
  return p.Balance_calc > 0 ? { Paid_USD: Math.round(p.Balance_calc * 100) / 100 } : {}; } }];
UI.FK_GROUP_FILTER.LSB_Lead_Qualifying = { LSB_Task: ['Lead Qualification'] };
UI.FK_GROUP_FILTER.LSB_Bidding_action_plan = { LSB_Task: ['Lead Qualification', 'Bidding'] };
UI.FK_GROUP_FILTER.LSB_Project_task = { LSB_Task: ['Contracting', 'Execution', 'Payment'] };

/* ============================== 2. Dashboard ============================== */
/* Phần lõi chép từ v2.6 (đã duyệt), chỉnh: chi phí theo LSB_cost.Payment_day, Tổng quan thêm KPI thầu. */
var Dash = {
  WIN: [7, 14, 30, 60],
  TABS: ['ov', 'bd', 'ar', 'pr', 'cu', 'chk'],
  st: { tab: 'ov', cur: 'USD', win: 30, q: 'all', cus: 'all', status: 'all', nat: 'all', open: {} },
  load: function () {
    try {
      var v = JSON.parse(localStorage.getItem('lsb.dash.v3') || '{}');
      if (Dash.TABS.indexOf(v.tab) >= 0) Dash.st.tab = v.tab;
      if (v.cur === 'USD' || v.cur === 'VND') Dash.st.cur = v.cur;
      if (Dash.WIN.indexOf(v.win) >= 0) Dash.st.win = v.win;
    } catch (e) { /* bỏ qua */ }
  },
  save: function () {
    try { localStorage.setItem('lsb.dash.v3', JSON.stringify({ tab: Dash.st.tab, cur: Dash.st.cur, win: Dash.st.win })); } catch (e) { /* bỏ qua */ }
  }
};
Dash.load();

/* ------------------------------ Tiện ích ------------------------------ */
Dash.days = function (a, b) {
  var x = String(a || '').match(/^(\d{4})-(\d{2})-(\d{2})/), y = String(b || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!x || !y) return null;
  return Math.round((Date.UTC(+y[1], +y[2] - 1, +y[3]) - Date.UTC(+x[1], +x[2] - 1, +x[3])) / 864e5);
};
Dash.money = function (usd, compact) {
  usd = Number(usd) || 0;
  if (Dash.st.cur === 'VND') {
    var v = usd * Dash.b.fx;
    return compact ? (v / 1e9).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + L(' tỷ ₫', 'B ₫') : Math.round(v / 1e6).toLocaleString('vi-VN');
  }
  return compact ? '$' + Fmt.compact(usd) : Fmt.usd(usd);
};
Dash.curHead = function () { return Dash.st.cur === 'VND' ? L('(triệu ₫)', '(million ₫)') : '(USD)'; };
Dash.pct = function (a, b) { return b ? Math.round(a / b * 100) + '%' : '—'; };
Dash.ton = function (t) { return Fmt.num(Number(t) || 0, 0) + ' t'; };
Dash.sum = function (arr, f) { return arr.reduce(function (s, x) { return s + (Number(f(x)) || 0); }, 0); };
Dash.inPeriod = function (d) {
  if (!d) return false;
  var y = Dash.year;
  if (y === 'all') return true;
  if (String(d).slice(0, 4) !== String(y)) return false;
  return Dash.st.q === 'all' || Math.ceil(+String(d).slice(5, 7) / 3) === +Dash.st.q;
};
Dash.periodName = function () {
  if (Dash.year === 'all') return L('mọi kỳ', 'all periods');
  return Dash.st.q === 'all' ? L('năm ', 'year ') + Dash.year : 'Q' + Dash.st.q + '/' + Dash.year;
};

/* Tình trạng lô hàng — suy ra từ mốc ngày, mốc sau thắng mốc trước. */
Dash.SH = function (k) {
  return {
    pln: [L('Chưa sản xuất', 'Not started'), ''], fab: [L('Đang sản xuất', 'In fabrication'), 'blue'],
    rdy: [L('Chờ xuất', 'Awaiting shipment'), 'warn'], sea: [L('Đang vận chuyển', 'In transit'), 'blue'], arr: [L('Đã đến cảng', 'Arrived'), 'ok']
  }[k];
};
Dash.shState = function (s) {
  var t = Dash.b.today;
  function hit(d) { return !!d && d <= t; }
  if (hit(s.etaA)) return 'arr';
  if (hit(s.etdA)) return 'sea';
  if (hit(s.cFab)) return 'rdy';
  if (hit(s.sFab)) return 'fab';
  return 'pln';
};
Dash.shBadge = function (s) { var x = Dash.SH(Dash.shState(s)); return UI.badge(x[0], x[1]); };

Dash.PAY = { Paid: 'ok', Overdue: 'danger', Partial: 'warn', Open: 'blue' };
Dash.soon = function (p) {
  if (!(p.st === 'Open' || p.st === 'Partial') || !p.due) return false;
  var d = Dash.days(Dash.b.today, p.due);
  return d !== null && d >= 0 && d <= Dash.st.win;
};
Dash.payBadge = function (p) {
  return UI.badge(p.st, Dash.PAY[p.st]) + (Dash.soon(p) ? ' ' + UI.badge(L('sắp đến hạn', 'due soon'), 'warn') : '');
};

/* ------------------------------ Tổng hợp ------------------------------ */
Dash.agg = function () {
  var b = Dash.b, st = Dash.st;
  var cus = {}; b.customers.forEach(function (c) { cus[c.id] = c; });
  var ps = b.projects.filter(function (p) {
    return (st.cus === 'all' || p.cus === st.cus) && (st.status === 'all' || p.status === st.status) &&
      (st.nat === 'all' || (cus[p.cus] || {}).nation === st.nat);
  });
  var ids = {}; ps.forEach(function (p) { ids[p.id] = true; });
  var planIdx = {}; b.plans.forEach(function (p) { planIdx[p.id] = p; });
  var pps = b.plans.filter(function (p) { return ids[p.pj]; });
  var paid = b.paid.filter(function (x) { var p = planIdx[x.pp]; return p && ids[p.pj]; });
  var signed = ps.filter(function (p) { return Dash.inPeriod(p.cday); });
  var over = pps.filter(function (p) { return p.st === 'Overdue'; }), soon = pps.filter(Dash.soon);
  return {
    cus: cus, ps: ps, ids: ids, planIdx: planIdx, pps: pps, paid: paid, signed: signed, over: over, soon: soon,
    shs: b.shipments.filter(function (s) { return ids[s.pj]; }),
    costs: b.costs.filter(function (c) { return ids[c.pj]; }),
    contractAll: Dash.sum(ps, function (p) { return p.usd; }),
    contractSigned: Dash.sum(signed, function (p) { return p.usd; }),
    paidAll: Dash.sum(paid, function (x) { return x.usd; }),
    paidPeriod: Dash.sum(paid.filter(function (x) { return Dash.inPeriod(x.day); }), function (x) { return x.usd; }),
    overUSD: Dash.sum(over, function (p) { return p.bal; }),
    soonUSD: Dash.sum(soon, function (p) { return p.bal; })
  };
};
Dash.cusName = function (a, id) { return (a.cus[id] || {}).name || id || ''; };
Dash.prj = function (id) { return Dash.b.projects.filter(function (p) { return p.id === id; })[0] || { id: id, name: id }; };
Dash.ship = function (id) { return Dash.b.shipments.filter(function (s) { return s.id === id; })[0]; };

/* Kiểm tra dữ liệu — điểm lệch cần sửa trong Sheet. */
Dash.checks = function (a) {
  var out = [];
  Dash.b.paid.forEach(function (x) {
    if (!a.planIdx[x.pp]) out.push(['danger', '<b>' + Fmt.esc(x.id) + '</b> (' + Fmt.usd(x.usd) + ' USD, ' + Fmt.date(x.day) + L(') trỏ tới <b>', ') points to <b>') +
      Fmt.esc(x.pp || '—') + L('</b> không có trong LSB_payment_plan → không được tính vào đã thu.', '</b>, which is not in LSB_payment_plan → not counted as collected.')]);
  });
  a.ps.forEach(function (p) {
    var mine = Dash.b.plans.filter(function (x) { return x.pj === p.id; });
    var plan = Dash.sum(mine, function (x) { return x.usd; });
    if (mine.length && Math.abs(plan - p.usd) > 1) out.push(['warn', '<b>' + Fmt.esc(p.id) + L('</b>: tổng kế hoạch thanh toán ', '</b>: total payment plan ') +
      Fmt.usd(plan) + L(' ≠ giá trị HĐ ', ' ≠ contract value ') + Fmt.usd(p.usd) + ' (' + Dash.pct(plan, p.usd) + ').']);
    mine.forEach(function (x) {
      if (x.pct && p.usd && Math.abs(x.usd - p.usd * x.pct) > 1) out.push(['warn', '<b>' + Fmt.esc(x.id) + '</b>: Payment_pct ' + Math.round(x.pct * 100) +
        L('% × HĐ = ', '% × contract = ') + Fmt.usd(p.usd * x.pct) + L(', nhưng Payment_USD = ', ', but Payment_USD = ') + Fmt.usd(x.usd) + '.']);
    });
    var cost = Dash.sum(Dash.b.costs.filter(function (c) { return c.pj === p.id && c.st !== 'Planned'; }), function (c) { return c.usd; });
    if (p.usd && cost > p.usd) out.push(['warn', '<b>' + Fmt.esc(p.id) + L('</b>: chi phí thực tế ', '</b>: actual cost ') + Fmt.usd(cost) + L(' lớn hơn giá trị HĐ ', ' exceeds contract value ') + Fmt.usd(p.usd) + '.']);
    var t = Dash.sum(Dash.b.shipments.filter(function (s) { return s.pj === p.id; }), function (s) { return s.t; });
    if (p.tAct && t && Math.abs(t - p.tAct) > 0.5) out.push(['warn', '<b>' + Fmt.esc(p.id) + '</b>: Tonnage_Actual ' + Dash.ton(p.tAct) + L(' khác tổng tấn các lô ', ' differs from total shipment tons ') + Dash.ton(t) + '.']);
  });
  return out;
};

/* ------------------------------ Khối dùng chung ------------------------------ */
Dash.how = function (items) {
  return '<details class="dash-how"><summary>' + L('Cách tính', 'How it is calculated') + '</summary><ul>' +
    items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul></details>';
};
Dash.winSeg = function () {
  return '<div class="seg">' + Dash.WIN.map(function (n) {
    return '<button data-win="' + n + '" class="' + (Dash.st.win === n ? 'on' : '') + '">' + n + L(' ngày', ' days') + '</button>';
  }).join('') + '</div>';
};
Dash.go = function (pj, tab) { return ' data-go="' + Fmt.esc(pj) + '" data-tab="' + tab + '"'; };
Dash.bar = function (a, b) {
  return '<div class="dash-pbar"><div class="bar ok"><i style="width:' + (b ? Math.min(100, a / b * 100) : 0).toFixed(1) + '%"></i></div><span>' + Dash.pct(a, b) + '</span></div>';
};

Dash.dueTable = function (a, mode) {
  var rows = (mode === 'over' ? a.over : a.soon).slice().sort(function (x, y) { return String(x.due || '').localeCompare(String(y.due || '')); });
  if (!rows.length) return '<div class="table-wrap"><div class="empty">' + (mode === 'over' ? L('Không có đợt nào quá hạn.', 'No overdue milestones.') :
    L('Không có đợt nào đến hạn trong ', 'No milestones due in the next ') + Dash.st.win + L(' ngày tới.', ' days.')) + '</div></div>';
  return '<div class="table-wrap"><table class="tbl"><thead><tr><th>Due_day</th><th>' + L('Dự án · Lô · Khách hàng', 'Project · Shipment · Customer') + '</th><th>' + L('Đợt', 'Milestone') +
    '</th><th class="num">' + L('Phải thu ', 'Amount ') + Dash.curHead() + '</th><th class="num">' + L('Đã thu', 'Collected') + '</th><th class="num">' + L('Còn lại', 'Balance') +
    '</th><th>' + (mode === 'over' ? L('Quá hạn', 'Overdue') : L('Còn', 'Due in')) + '</th><th>' + L('Hồ sơ cần', 'Required docs') + '</th></tr></thead><tbody>' +
    rows.map(function (pp) {
      var p = Dash.prj(pp.pj), sh = pp.sh && Dash.ship(pp.sh), d = Dash.days(Dash.b.today, pp.due);
      return '<tr class="click"' + Dash.go(p.id, 'pay') + '><td class="nowrap">' + Fmt.date(pp.due) + '</td><td>' + Fmt.esc(p.name) +
        '<div class="small muted"><span class="id">' + Fmt.esc(p.id) + '</span> · ' + (sh ? L('Lô ', 'Shipment ') + Fmt.esc(sh.no) + (sh.code ? ' (' + Fmt.esc(sh.code) + ')' : '') : L('Chung dự án', 'Project-level')) +
        ' · ' + Fmt.esc(Dash.cusName(a, p.cus)) + '</div></td><td>' + Fmt.esc(pp.code || '') + (pp.pct ? ' ' + Math.round(pp.pct * 100) + '%' : '') + '<div class="id">' + Fmt.esc(pp.id) + '</div></td>' +
        '<td class="num">' + Dash.money(pp.usd) + '</td><td class="num">' + Dash.money(pp.col) + '</td><td class="num"><b>' + Dash.money(pp.bal) + '</b></td><td>' +
        (mode === 'over' ? UI.badge((d === null ? '' : -d) + L(' ngày', ' days'), 'danger') : UI.badge(d + L(' ngày', ' days'), 'warn')) +
        '</td><td class="small">' + Fmt.esc(pp.docs || '—') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
};

/* ------------------------------ Tab Tổng quan ------------------------------ */
Dash.vOverview = function (a, d, alerts, p) {
  var costAct = Dash.sum(a.costs.filter(function (c) { return c.st !== 'Planned' && Dash.inPeriod(c.day); }), function (c) { return c.usd; });
  var costPlanned = Dash.sum(a.costs.filter(function (c) { return c.st === 'Planned'; }), function (c) { return c.usd; });
  var gmE = a.contractAll ? Dash.sum(a.ps, function (x) { return x.usd * (x.gmE || 0); }) / a.contractAll : null;
  var withA = a.ps.filter(function (x) { return x.gmA !== null && x.gmA !== undefined; });
  var gmA = withA.length ? Dash.sum(withA, function (x) { return x.usd * x.gmA; }) / (Dash.sum(withA, function (x) { return x.usd; }) || 1) : null;
  var tShip = Dash.sum(a.shs.filter(function (s) { return Dash.inPeriod(s.etdA); }), function (s) { return s.t; });
  var fab = a.shs.filter(function (s) { return Dash.shState(s) === 'fab'; });
  var rest = a.contractAll - a.paidAll, per = Dash.periodName();
  var bk = Dash.bagg();
  return UI.kpis([
    { label: L('Hợp đồng ký ', 'Contracts signed ') + per, value: Dash.money(a.contractSigned, true), sub: a.signed.length + L(' dự án · theo Contract_day', ' projects · by Contract_day'), tone: 'accent' },
    { label: L('Đã thu ', 'Collected ') + per, value: Dash.money(a.paidPeriod, true), sub: L('theo Payment_day', 'by Payment_day'), tone: 'ok' },
    { label: L('Còn phải thu', 'Receivable'), value: Dash.money(rest, true), sub: L('hôm nay · đã thu ', 'today · collected ') + Dash.pct(a.paidAll, a.contractAll) + L(' giá trị HĐ', ' of contract value') +
      '<div class="bar ok" style="margin-top:6px"><i style="width:' + (a.contractAll ? Math.min(100, a.paidAll / a.contractAll * 100) : 0).toFixed(1) + '%"></i></div>' },
    { label: L('Quá hạn', 'Overdue'), value: Dash.money(a.overUSD, true), sub: a.over.length + L(' đợt Overdue', ' overdue milestones'), tone: a.over.length ? 'danger' : '' },
    { label: L('Đến hạn ', 'Due in ') + Dash.st.win + L(' ngày tới', ' days'), value: Dash.money(a.soonUSD, true), sub: a.soon.length + L(' đợt', ' milestones'), tone: a.soon.length ? 'warn' : '' }
  ]) + UI.kpis([
    { label: L('Chi phí ', 'Costs ') + per, value: Dash.money(costAct, true), sub: L('Invoiced + Paid · còn ', 'Invoiced + Paid · ') + Dash.money(costPlanned, true) + L(' Planned', ' still Planned') },
    { label: L('Biên LN dự kiến', 'Planned gross margin'), value: gmE === null ? '—' : Fmt.pct(gmE, 1), sub: L('Grossmargin_EST, bình quân theo HĐ', 'Grossmargin_EST, contract-weighted') },
    { label: L('Biên LN thực tế', 'Actual gross margin'), value: gmA === null ? '—' : Fmt.pct(gmA, 1), sub: withA.length + L(' dự án đã nhập Grossmargin_Actual', ' projects with Grossmargin_Actual') },
    { label: L('Sản lượng', 'Tonnage'), value: Dash.ton(Dash.sum(a.ps, function (x) { return x.tAct; })),
      sub: L('kế hoạch ', 'planned ') + Dash.ton(Dash.sum(a.ps, function (x) { return x.tEst; })) + L(' · xuất ', ' · shipped ') + per + ' ' + Dash.ton(tShip) },
    { label: L('Đang sản xuất', 'In fabrication'), value: Dash.ton(Dash.sum(fab, function (s) { return s.t; })), sub: fab.length + L(' lô hàng', ' shipments') }
  ]) + UI.kpis([
    { label: L('Pipeline có trọng số', 'Weighted pipeline'), value: Dash.money(bk.wpipe, true), sub: bk.open.length + L(' báo giá đang chạy · tổng ', ' open quotations · total ') + Dash.money(bk.pipe, true), tone: 'accent' },
    { label: L('Tỷ lệ thắng ', 'Win rate ') + per, value: bk.rate === null ? '—' : Fmt.pct(bk.rate, 0), sub: bk.won.length + L(' thắng / ', ' won / ') + bk.lost.length + L(' thua · theo Result_day', ' lost · by Result_day') },
    { label: L('Việc thầu trễ hạn', 'Overdue bid tasks'), value: String(bk.late.length), sub: bk.soonT.length + L(' việc đến hạn trong ', ' tasks due in ') + Dash.st.win + L(' ngày', ' days'), tone: bk.late.length ? 'danger' : '' }
  ]) +
    '<div class="card"><div class="card-head"><h3>' + L('Dòng tiền theo tháng ', 'Monthly cash flow ') + Dash.chartYear() + '</h3><div class="dash-legend"><span><i class="plan"></i>' +
    L('Kế hoạch thu', 'Planned') + '</span><span><i class="paid"></i>' + L('Đã thu', 'Collected') + '</span></div></div>' + Dash.cashChart(a) +
    Dash.how([L('Kế hoạch thu = tổng <code>LSB_payment_plan.Payment_USD</code> theo tháng của <code>Due_day</code>.', 'Planned = sum of <code>LSB_payment_plan.Payment_USD</code> by month of <code>Due_day</code>.'),
      L('Đã thu = tổng <code>LSB_paid.Paid_USD</code> theo tháng của <code>Payment_day</code>.', 'Collected = sum of <code>LSB_paid.Paid_USD</code> by month of <code>Payment_day</code>.')]) + '</div>' +
    '<div class="card"><div class="card-head"><h3>' + L('Quá hạn', 'Overdue') + '</h3><span class="small muted">' + L('Bấm dòng → Dự án 360° › Thanh toán', 'Click a row → Project 360° › Payments') + '</span></div>' + Dash.dueTable(a, 'over') + '</div>' +
    '<div class="card"><div class="card-head"><h3>' + L('Đến hạn sắp tới', 'Coming due') + '</h3>' + Dash.winSeg() + '</div>' + Dash.dueTable(a, 'soon') + '</div>' +

Dash.chartYear = function () { return Dash.year === 'all' ? Dash.b.today.slice(0, 4) : String(Dash.year); };
Dash.cashChart = function (a) {
  var yr = Dash.chartYear(), plan = [], paid = [], m;
  for (m = 0; m < 12; m++) { plan.push(0); paid.push(0); }
  a.pps.forEach(function (pp) { if (String(pp.due || '').slice(0, 4) === yr) plan[+pp.due.slice(5, 7) - 1] += pp.usd; });
  a.paid.forEach(function (x) { if (String(x.day || '').slice(0, 4) === yr) paid[+x.day.slice(5, 7) - 1] += x.usd; });
  var mx = Math.max.apply(null, plan.concat(paid).concat([1]));
  var p10 = Math.pow(10, Math.floor(Math.log10(mx / 4))), n = mx / 4 / p10, step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p10, top = Math.ceil(mx / step) * step;
  var W = 760, H = 230, Lx = 62, B = 26, T = 10, cw = (W - Lx - 8) / 12;
  function h(v) { return (H - B - T) * v / top; }
  function lab(v) { return Dash.st.cur === 'VND' ? (v * Dash.b.fx / 1e9).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + L(' tỷ', 'B') : '$' + Fmt.compact(v); }
  var g = '', v, curM = Dash.b.today.slice(0, 4) === yr ? +Dash.b.today.slice(5, 7) - 1 : -1;
  for (v = 0; v <= top + 1e-9; v += step) {
    var y = H - B - h(v);
    g += '<line x1="' + Lx + '" x2="' + (W - 8) + '" y1="' + y + '" y2="' + y + '" class="grid"/><text x="' + (Lx - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + lab(v) + '</text>';
  }
  for (m = 0; m < 12; m++) {
    var x = Lx + m * cw + cw * 0.14, bw = cw * 0.34;
    g += '<rect class="plan" x="' + x + '" y="' + (H - B - h(plan[m])) + '" width="' + bw + '" height="' + h(plan[m]) + '" rx="2"><title>T' + (m + 1) + ': ' + L('kế hoạch ', 'planned ') + Dash.money(plan[m]) + '</title></rect>';
    g += '<rect class="paid" x="' + (x + bw + 2) + '" y="' + (H - B - h(paid[m])) + '" width="' + bw + '" height="' + h(paid[m]) + '" rx="2"><title>T' + (m + 1) + ': ' + L('đã thu ', 'collected ') + Dash.money(paid[m]) + '</title></rect>';
    g += '<text x="' + (Lx + m * cw + cw / 2) + '" y="' + (H - 8) + '" text-anchor="middle"' + (m === curM ? ' class="cur"' : '') + '>' + L('T', 'M') + (m + 1) + '</text>';
  }
  return '<div class="table-wrap dash-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + L('Kế hoạch thu và đã thu theo tháng', 'Planned vs collected by month') + '">' + g + '</svg></div>';
};

Dash.bagg = function () {
  var b = Dash.b, st = Dash.st, today = b.today;
  var cl = st.cus === 'all' ? null : ((b.customers.filter(function (c) { return c.id === st.cus; })[0] || {}).lead || '#');
  var ls = b.leads.filter(function (l) { return (!cl || l.id === cl) && (st.nat === 'all' || l.nation === st.nat); });
  var lid = {}; ls.forEach(function (l) { lid[l.id] = true; });
  var qs = b.quotes.filter(function (q) { return lid[q.lead]; }), qid = {};
  qs.forEach(function (q) { qid[q.id] = q; });
  var open = qs.filter(function (q) { return Dash.OPEN_Q.indexOf(q.st) >= 0; });
  var res = b.results.filter(function (r) { return qid[r.q]; });
  var resP = res.filter(function (r) { return Dash.inPeriod(r.day); });
  var won = resP.filter(function (r) { return r.res === 'Won'; }), lost = resP.filter(function (r) { return r.res === 'Lost'; });
  var val = function (r) { return (qid[r.q] || {}).usd || 0; };
  var tasks = b.bidTasks.filter(function (t) { return lid[t.lead] && t.st !== 'Done'; }).map(function (t) {
    var o = {}; for (var k in t) o[k] = t[k]; o.d = t.due ? Dash.days(today, t.due) : null; return o;
  });
  var wv = Dash.sum(won, val), lv = Dash.sum(lost, val);
  return {
    ls: ls, qs: qs, open: open, res: res, resP: resP, won: won, lost: lost, val: val, tasks: tasks,
    pipe: Dash.sum(open, function (q) { return q.usd; }),
    wpipe: Dash.sum(open, function (q) { return q.usd * (q.prob || 0); }),
    issued: qs.filter(function (q) { return Dash.inPeriod(q.day); }),
    rate: won.length + lost.length ? won.length / (won.length + lost.length) : null,
    rateV: wv + lv ? wv / (wv + lv) : null,
    late: tasks.filter(function (t) { return t.d !== null && t.d < 0; }),
    soonT: tasks.filter(function (t) { return t.d !== null && t.d >= 0 && t.d <= Dash.st.win; })

Dash.bchecks = function () {

      });

        x[0].forEach(function (r) { var v = String(r[x[1]] || '').slice(0, 4); if (/^\d{4}$/.test(v)) y[v] = true; });

        var c = e.target.closest('[data-cur]'); if (c) { st.cur = c.dataset.cur; Dash.save(); redraw(); return; }
        var w = e.target.closest('[data-win]'); if (w) { st.win = +w.dataset.win; Dash.save(); redraw(); return; }

          { key: 'Payment_day', label: L('Ngày thu', 'Received on'), render: function (r) { return Fmt.date(r.Payment_day); } }
        ], d.paid, { empty: L('Chưa thu', 'Nothing received yet'), onRow: editor('LSB_paid') });
      bindAdd(el);
      var ap = el.querySelector('#add-paid');
      if (ap) ap.onclick = function () {
        var open = d.plans.filter(function (x) { return x.Balance_calc > 0; })[0] || d.plans[0];
        App.edit('LSB_paid', {}, { context: { PaymentPlan_id: open.PaymentPlan_id }, defaults: { PaymentPlan_id: open.PaymentPlan_id, Payment_day: App.boot.today }, onSaved: reload });
      };
    } },
    { id: 'cost', label: L('Chi phí', 'Costs'), count: d.costs.length, render: function (el) {
      el.innerHTML = '<div class="card-head"><h3>' + L('Chi phí', 'Costs') + '</h3><span class="muted small">' + L('Tổng ', 'Total ') + Fmt.usd(k.costUSD) + ' USD</span>' + addBtn('LSB_cost') + '</div>' +
        UI.table([
          { key: 'Cost_id', label: L('Mã', 'ID'), render: idCell('LSB_cost', 'Cost_id') },
          { key: 'Category', label: L('Nhóm', 'Category'), render: function (r) { return UI.badge(r.Category); } },
          { key: 'Vendor', label: L('Nhà cung cấp', 'Vendor') },
          { key: 'Cost_USD', label: 'USD', num: true, render: function (r) { return Fmt.usd(r.Cost_USD); } },
          { key: 'Cost_VND', label: 'VND', num: true, render: function (r) { return Fmt.usd(r.Cost_VND); } },
          { key: 'Invoice_no', label: L('Số hóa đơn', 'Invoice no.'), render: function (r) { return Fmt.esc(r.Invoice_no); } },
          { key: 'Payment_day', label: L('Ngày trả', 'Paid on'), render: function (r) { return Fmt.date(r.Payment_day); } },
          { key: 'Cost_status', label: L('Trạng thái', 'Status'), render: function (r) { return UI.status(r.Cost_status); } }
        ], d.costs, { empty: L('Chưa có chi phí', 'No costs yet'), onRow: editor('LSB_cost') });
      bindAdd(el);
    } },
    { id: 'lesson', label: L('Bài học', 'Lessons'), count: d.lessons.length, render: function (el) {
      el.innerHTML = '<div class="card-head"><h3>' + L('Bài học bàn giao', 'Handover lessons') + '</h3>' + addBtn('LSB_Project_handover_lesson') + '</div>' +
        UI.table([
          { key: 'Lesson_id', label: L('Mã', 'ID'), render: function (r) { return '<span class="id">' + Fmt.esc(r.Lesson_id) + '</span>' + UI.missingBadge('LSB_Project_handover_lesson', r) + '<div class="small muted">' + Fmt.date(r.Handover_day) + '</div>'; } },
          { key: 'Phase', label: L('Giai đoạn / Nhóm', 'Phase / Category'), render: function (r) { return Fmt.esc(r.Phase) + '<div>' + UI.badge(r.Category) + '</div>'; } },
          { key: 'Issue_description', label: L('Vấn đề → Nguyên nhân', 'Issue → Root cause'), render: function (r) { return Fmt.esc(r.Issue_description) + '<div class="small muted">' + Fmt.esc(r.Root_cause) + '</div>'; } },
          { key: 'Action_next_project', label: L('Áp dụng dự án sau', 'Apply to next project') },
          { key: 'Impact_USD', label: L('Ảnh hưởng', 'Impact'), num: true, render: function (r) { return Fmt.usd(r.Impact_USD) + (r.Impact_days ? '<div class="small muted">' + Fmt.esc(r.Impact_days) + L(' ngày', ' days') + '</div>' : ''); } },
          { key: 'Customer_feedback', label: L('Điểm KH', 'Customer score'), num: true }
        ], d.lessons, { empty: L('Chưa có bài học — cần ít nhất 1 để đóng dự án', 'No lessons yet — at least 1 is needed to close the project'), onRow: editor('LSB_Project_handover_lesson') });
      bindAdd(el);
    } }
  ];
  if (App.can('activity')) tabs.push({ id: 'log', label: L('Nhật ký', 'Change log'), count: g.activity.length, render: function (el) { el.innerHTML = UI.activityList(g.activity); } });
  UI.tabs(view.querySelector('#tabs'), tabs, p.tab);
};
</script>
